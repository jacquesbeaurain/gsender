<!doctype html>
<!--
  gSender's wireless pendant (upstream: the React app's /remote routes -
  Control, Workflow, Info). Served by the application's remote mode; talks
  JSON over the WebSocket at /ws (gs/remote/pendant.hpp). Self-contained:
  a phone on a shop network may have no internet.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f2937">
<title>gSender Remote</title>
<style>
:root {
  --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #d1d5db;
  --blue: #3b82f6; --blue-dark: #1d4ed8; --green: #16a34a; --yellow: #ca8a04; --red: #dc2626;
  --btn: #e5e7eb; --btn-text: #111827;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af; --line: #374151;
          --btn: #374151; --btn-text: #f9fafb; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: 72px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; background: #1f2937; color: #f9fafb; }
header .title { font-weight: 700; flex: 1; }
.pill { padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; background: #6b7280; color: #fff; }
.pill.Idle { background: var(--green); } .pill.Run, .pill.Jog, .pill.Home { background: var(--blue); }
.pill.Hold, .pill.Door, .pill.Tool, .pill.Check { background: var(--yellow); }
.pill.Alarm { background: var(--red); }
main { padding: 12px; display: flex; flex-direction: column; gap: 12px; max-width: 560px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
.muted { color: var(--muted); font-size: 13px; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; min-height: 48px; padding: 0 12px;
  background: var(--btn); color: var(--btn-text); }
button:active:not(:disabled) { filter: brightness(0.85); }
button:disabled { opacity: 0.4; }
button.primary { background: var(--blue); color: #fff; }
button.go { background: var(--green); color: #fff; }
button.warn { background: var(--yellow); color: #fff; }
button.danger { background: var(--red); color: #fff; }
button.sel { background: var(--blue); color: #fff; }
select { font: inherit; min-height: 44px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); padding: 0 8px; }
.banner { display: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.banner.show { display: flex; gap: 8px; align-items: center; }
.banner.alarm { background: #fee2e2; color: #991b1b; }
.banner.off { background: #fef3c7; color: #92400e; }
.dro { width: 100%; border-collapse: collapse; }
.dro td { padding: 4px 2px; }
.dro .axis { font-weight: 800; font-size: 22px; width: 32px; }
.dro .work { font: 700 26px/1.1 ui-monospace, Menlo, Consolas, monospace; text-align: right; }
.dro .mach { font: 13px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); text-align: right; width: 84px; }
.dro button { min-height: 40px; min-width: 56px; }
.jog { display: grid; grid-template-columns: repeat(3, 1fr) 16px 1fr; gap: 8px; }
.jog button { min-height: 64px; font-size: 22px; }
.jog .stop { background: var(--red); color: #fff; font-size: 16px; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.steps { display: flex; justify-content: space-between; margin-top: 6px; }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.big button { min-height: 72px; font-size: 18px; }
.progress { height: 10px; background: var(--btn); border-radius: 5px; overflow: hidden; margin: 8px 0; }
.progress div { height: 100%; width: 0; background: var(--blue); }
dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; }
dt { color: var(--muted); } dd { margin: 0; font-weight: 600; text-align: right; }
nav { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--card); border-top: 1px solid var(--line); z-index: 5; }
nav button { border-radius: 0; background: none; min-height: 64px; color: var(--muted); }
nav button.active { color: var(--blue); box-shadow: inset 0 3px 0 var(--blue); }
section { display: flex; flex-direction: column; gap: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <span class="title">gSender Remote</span>
  <span id="status" class="pill">Connecting</span>
</header>

<main>
  <div id="offline" class="banner off">Reconnecting to gSender...</div>
  <div id="disconnected" class="banner off">gSender is not connected to a machine.</div>
  <div id="alarm" class="banner alarm"><span class="grow" id="alarmText">Alarm</span>
    <button class="danger" data-cmd="unlock">Unlock</button></div>

  <!-- Control: workspace, DRO, jogging -->
  <section id="page-control">
    <div class="card">
      <div class="row">
        <select id="wcs" aria-label="Workspace">
          <option>G54</option><option>G55</option><option>G56</option>
          <option>G57</option><option>G58</option><option>G59</option>
        </select>
        <span class="grow"></span>
        <button data-cmd="home" id="home">Home</button>
        <button data-cmd="unlock">Unlock</button>
      </div>
      <table class="dro" id="dro"></table>
      <div class="row" style="margin-top:8px">
        <button class="grow" data-move="zeroAll">Zero All</button>
        <button class="grow" data-move="goToZero" data-axes="XY">Go XY0</button>
        <button class="grow" data-move="goToZero" data-axes="Z">Go Z0</button>
      </div>
    </div>

    <div class="card">
      <div class="jog">
        <button data-jog="-1,1,0,0" aria-label="X- Y+">&#8598;</button>
        <button data-jog="0,1,0,0" aria-label="Y+">Y+</button>
        <button data-jog="1,1,0,0" aria-label="X+ Y+">&#8599;</button>
        <span></span>
        <button data-jog="0,0,1,0" aria-label="Z+">Z+</button>
        <button data-jog="-1,0,0,0" aria-label="X-">X-</button>
        <button class="stop" id="jogStop">STOP</button>
        <button data-jog="1,0,0,0" aria-label="X+">X+</button>
        <span></span>
        <button data-jog="0,0,-1,0" aria-label="Z-">Z-</button>
        <button data-jog="-1,-1,0,0" aria-label="X- Y-">&#8601;</button>
        <button data-jog="0,-1,0,0" aria-label="Y-">Y-</button>
        <button data-jog="1,-1,0,0" aria-label="X+ Y-">&#8600;</button>
        <span></span>
        <span></span>
      </div>
      <div class="row" id="aJog" style="margin-top:8px" hidden>
        <button class="grow" data-jog="0,0,0,-1">A-</button>
        <button class="grow" data-jog="0,0,0,1">A+</button>
      </div>
      <div class="presets" style="margin-top:12px">
        <button data-preset="Rapid">Rapid</button>
        <button data-preset="Normal">Normal</button>
        <button data-preset="Precise">Precise</button>
      </div>
      <div class="steps muted" id="steps"></div>
    </div>
  </section>

  <!-- Workflow: the job -->
  <section id="page-workflow" hidden>
    <div class="card">
      <div class="muted">File</div>
      <div id="file" style="font-weight:700;word-break:break-all">No file loaded</div>
      <div class="progress"><div id="bar"></div></div>
      <div class="row muted"><span id="lines" class="grow">0 / 0</span><span id="remaining"></span></div>
    </div>
    <div class="big">
      <button class="go" data-cmd="start" id="start">Start</button>
      <button class="warn" data-cmd="pause" id="pause">Pause</button>
      <button class="danger" data-cmd="stop" id="stop">Stop</button>
    </div>
  </section>

  <!-- Info: the machine -->
  <section id="page-info" hidden>
    <div class="card">
      <dl>
        <dt>Connection</dt><dd id="port">-</dd>
        <dt>State</dt><dd id="state">-</dd>
        <dt>Workspace</dt><dd id="infoWcs">-</dd>
        <dt>Units</dt><dd id="units">-</dd>
        <dt>Feed rate</dt><dd id="feed">-</dd>
        <dt>Spindle</dt><dd id="spindle">-</dd>
      </dl>
    </div>
    <button class="danger" data-cmd="reset">Soft Reset</button>
  </section>
</main>

<nav>
  <button data-page="control" class="active">Control</button>
  <button data-page="workflow">Workflow</button>
  <button data-page="info">Info</button>
</nav>

<script>
(function () {
  'use strict';
  var ws = null, state = null, retry = 500, held = null, pingTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  function send(msg) {
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); }
  }

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = function () { retry = 500; $('offline').classList.remove('show'); };
    ws.onmessage = function (e) {
      var msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
      if (msg.type === 'state') { state = msg; render(); }
    };
    ws.onclose = function () {
      release();
      state = null; render();
      $('offline').classList.add('show');
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 5000);
    };
  }

  // Jogging: press to start, let go to stop (a tap jogs one step). The page
  // pings while a button is held; gSender stops a jog it stops hearing about.
  function press(button) {
    if (held || !state || !state.canJog) { return; }
    var d = button.getAttribute('data-jog').split(',').map(Number);
    held = button;
    button.classList.add('sel');
    send({ type: 'jogPress', x: d[0], y: d[1], z: d[2], a: d[3] });
    pingTimer = setInterval(function () { send({ type: 'ping' }); }, 250);
  }
  function release() {
    if (!held) { return; }
    held.classList.remove('sel');
    held = null;
    clearInterval(pingTimer);
    send({ type: 'jogRelease' });
  }
  document.querySelectorAll('[data-jog]').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); b.setPointerCapture(e.pointerId); press(b); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) { b.addEventListener(t, release); });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });
  window.addEventListener('blur', release);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { release(); } });
  $('jogStop').addEventListener('click', function () { release(); send({ type: 'jogStop' }); });

  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    b.addEventListener('click', function () { send({ type: b.getAttribute('data-cmd') }); });
  });
  document.querySelectorAll('[data-preset]').forEach(function (b) {
    b.addEventListener('click', function () { send({ type: 'preset', preset: b.getAttribute('data-preset') }); });
  });
  document.querySelectorAll('[data-move]').forEach(function (b) {
    b.addEventListener('click', function () {
      send({ type: b.getAttribute('data-move'), axes: b.getAttribute('data-axes') || undefined });
    });
  });
  $('wcs').addEventListener('change', function (e) { send({ type: 'workspace', wcs: e.target.value }); });
  $('dro').addEventListener('click', function (e) {
    var axis = e.target.getAttribute && e.target.getAttribute('data-zero');
    if (axis) { send({ type: 'zeroAxis', axis: axis }); }
  });

  document.querySelectorAll('nav button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('nav button').forEach(function (o) { o.classList.toggle('active', o === b); });
      ['control', 'workflow', 'info'].forEach(function (p) {
        $('page-' + p).hidden = p !== b.getAttribute('data-page');
      });
    });
  });

  function fixed(v, n) { return Number(v).toFixed(n); }
  function clock(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = s % 60;
    return h + ':' + (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function setEnabled(selector, on) {
    document.querySelectorAll(selector).forEach(function (b) { b.disabled = !on; });
  }

  function render() {
    var s = state, live = !!(s && s.connected);
    $('status').textContent = s ? (live ? s.statusLabel : 'Disconnected') : 'Offline';
    $('status').className = 'pill ' + (live ? s.activeState : '');
    $('disconnected').classList.toggle('show', !!s && !live);
    var alarm = live && s.activeState === 'Alarm';
    $('alarm').classList.toggle('show', alarm);
    if (alarm) { $('alarmText').textContent = 'Alarm' + (s.alarmCode ? ' ' + s.alarmCode : ''); }

    var unit = s && !s.metric ? 'in' : 'mm', dec = s ? s.decimals : 2;
    var axes = ['X', 'Y', 'Z'].concat(s && s.hasA ? ['A'] : []);
    var html = '';
    axes.forEach(function (a, i) {
      html += '<tr><td class="axis">' + a + '</td><td class="work">' + (live ? fixed(s.wpos[i], i === 3 ? 2 : dec) : '-') +
        '</td><td class="mach">' + (live ? fixed(s.mpos[i], i === 3 ? 2 : dec) : '') +
        '</td><td><button data-zero="' + a + '"' + (live && s.canJog ? '' : ' disabled') + '>' + a + '0</button></td></tr>';
    });
    $('dro').innerHTML = html;
    $('aJog').hidden = !(s && s.hasA);
    if (s) {
      if (document.activeElement !== $('wcs')) { $('wcs').value = s.wcs; }
      document.querySelectorAll('[data-preset]').forEach(function (b) {
        b.classList.toggle('sel', b.getAttribute('data-preset') === s.jogPreset);
      });
      $('steps').textContent = 'XY ' + s.xyStep + ' ' + unit + '   Z ' + s.zStep + ' ' + unit +
        '   A ' + s.aStep + '°   F ' + s.jogFeed;
    }
    var canMove = live && s.canJog;
    setEnabled('[data-jog]', canMove);
    setEnabled('[data-move]', canMove);
    $('wcs').disabled = !live || s.workflow === 'running' || s.activeState === 'Run';
    $('home').disabled = !(canMove && s.homingEnabled);
    $('home').hidden = !(s && s.homingEnabled);
    setEnabled('[data-cmd="unlock"], [data-cmd="reset"]', live);
    $('jogStop').disabled = !live;

    $('file').textContent = s && s.fileName ? s.fileName : 'No file loaded';
    var total = s ? s.total : 0, done = s ? s.received : 0;
    $('bar').style.width = (total > 0 ? Math.min(100, 100 * done / total) : 0) + '%';
    $('lines').textContent = done + ' / ' + total + ' lines';
    $('remaining').textContent = s && s.workflow !== 'idle' ? clock(s.remainingMs) + ' left' : '';
    $('start').disabled = !(live && s.canRun);
    $('start').textContent = s && s.workflow === 'paused' ? 'Resume' : 'Start';
    $('pause').disabled = !(live && s.canPause);
    $('stop').disabled = !(live && s.canStop);

    $('port').textContent = s && s.port ? s.port : '-';
    $('state').textContent = s ? s.statusLabel : '-';
    $('infoWcs').textContent = s ? s.wcs : '-';
    $('units').textContent = s ? (s.metric ? 'Millimetres' : 'Inches') : '-';
    $('feed').textContent = live ? s.feedrate + (s.metric ? ' mm/min' : ' in/min') : '-';
    $('spindle').textContent = live ? String(s.spindle) : '-';
  }

  render();
  connect();
})();
</script>
</body>
</html>
